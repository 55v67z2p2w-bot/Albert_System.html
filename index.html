// ── MOOD WIDGET ───────────────────────────────────────────────────────────────
function MoodWidget({ moods, setMoods }) {
  const todayMood = moods.find(m => m.date === TODAY_DATE);
  const opts = [{v:'tired',e:'😴',l:'Tired'},{v:'ok',e:'😐',l:'Alright'},{v:'good',e:'🔥',l:'Ready'}];
  const set = v => setMoods(prev => [...prev.filter(m=>m.date!==TODAY_DATE), {date:TODAY_DATE,v}]);
  return (
    <div style={{marginBottom:10,padding:'11px 13px',background:'var(--card2)',borderRadius:10,border:'1px solid var(--bdr)'}}>
      <div style={{fontSize:'.6rem',fontWeight:800,color:'var(--tx3)',letterSpacing:'.08em',marginBottom:7}}>ENERGY CHECK</div>
      <div style={{display:'flex',gap:6}}>
        {opts.map(o=>(
          <button key={o.v} onClick={()=>set(o.v)} style={{flex:1,padding:'7px 4px',borderRadius:8,border:'2px solid',cursor:'pointer',textAlign:'center',transition:'all .15s',
            borderColor:todayMood?.v===o.v?(o.v==='good'?'var(--teal)':o.v==='ok'?'var(--green)':'var(--bdr2)'):'var(--bdr)',
            background:todayMood?.v===o.v?(o.v==='good'?'rgba(77,187,184,.12)':o.v==='ok'?'rgba(122,182,72,.12)':'rgba(255,255,255,.03)'):'none'}}>
            <div style={{fontSize:'1.25rem',lineHeight:1}}>{o.e}</div>
            <div style={{fontSize:'.57rem',fontWeight:800,color:'var(--tx3)',marginTop:3,letterSpacing:'.04em'}}>{o.l}</div>
          </button>
        ))}
      </div>
    </div>
  );
}

// ── BEST NEXT MOVE ────────────────────────────────────────────────────────────
function BestNextMove({ isSchoolDay, energy, kitDone, kitTotal, workoutLog, creatorLog, choresChecked, setTab }) {
  const kitOk = kitTotal === 0 || kitDone === kitTotal;
  const trainedToday = workoutLog.some(w => w.date === TODAY_DATE);
  const createdToday = creatorLog.some(c => c.date === TODAY_DATE);
  const choresDoneCount = Object.values(choresChecked||{}).filter(Boolean).length;
  const choresOk = choresDoneCount >= 2;

  let move = {icon:'🎒',text:'Pack your bag and check your kit',tab:'school'};

  if (energy === 'tired') {
    move = {icon:'🧘',text:'Recovery session — stretch and breathe',tab:'coach'};
  } else if (!kitOk && isSchoolDay) {
    move = {icon:'🎒',text:'Sort your kit before anything else',tab:'school'};
  } else if (!choresOk && !isSchoolDay) {
    move = {icon:'🏡',text:'Choose one proper helping job',tab:'chores'};
  } else if (!choresOk && isSchoolDay) {
    move = {icon:'🏠',text:'After-school reset — quick 5 minutes',tab:'chores'};
  } else if (!trainedToday && energy !== 'tired') {
    move = {icon:'🏃',text:energy==='ok'?'10-minute sport skills session':'Full training session — you are ready',tab:'coach'};
  } else if (!createdToday) {
    move = {icon:'🎬',text:'Open one Create challenge',tab:'create'};
  } else if (trainedToday && !energy) {
    move = {icon:'🧘',text:'Recovery done today — good rhythm',tab:'coach'};
  } else {
    move = {icon:'⭐',text:'Strong day — coach notes or review progress',tab:'progress'};
  }

  return (
    <div onClick={()=>setTab(move.tab)} style={{background:'linear-gradient(135deg,rgba(77,187,184,.09),rgba(77,187,184,.02))',border:'1px solid rgba(77,187,184,.25)',borderRadius:10,padding:'12px 15px',marginBottom:8,cursor:'pointer',display:'flex',alignItems:'center',gap:12}}>
      <div style={{fontSize:'1.6rem',flexShrink:0}}>{move.icon}</div>
      <div style={{flex:1}}>
        <div style={{fontSize:'.58rem',fontWeight:800,color:'var(--tealD)',letterSpacing:'.1em',textTransform:'uppercase',marginBottom:3}}>Best Next Move</div>
        <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:'1.05rem',letterSpacing:'.04em',color:'var(--teal)',lineHeight:1.15}}>{move.text}</div>
      </div>
      <div style={{color:'var(--teal)',opacity:.6,fontSize:'.8rem'}}>→</div>
    </div>
  );
}

// ── SCHOOL VIEW ───────────────────────────────────────────────────────────────
function SchoolView({ kit, setKit, kitChecked, setKitChecked }) {
  const [sub, setSub] = useState('uniform');
  const [newItem, setNewItem] = useState('');
  const SUB = [
    {id:'uniform',  label:'Uniform',    emoji:'👕', key:'uniform'},
    {id:'bag',      label:'School Bag', emoji:'🎒', key:'schoolBag'},
    {id:'pe',       label:'PE Kit',     emoji:'👟', key:'peKit'},
    {id:'rugby',    label:'Rugby Kit',  emoji:'🏉', key:'rugbyKit'},
    {id:'cricket',  label:'Cricket Kit',emoji:'🏏', key:'cricketKit'},
  ];
  const sKey = SUB.find(s=>s.id===sub).key;
  const items = kit[sKey] || [];
  const done = items.filter(i => kitChecked[sKey+'_'+i]).length;
  const pct  = items.length>0 ? Math.round(done/items.length*100) : 100;
  const allDone = items.length===0 || done===items.length;

  const toggle     = item => setKitChecked(p=>({...p,[sKey+'_'+item]:!p[sKey+'_'+item]}));
  const addItem    = () => { if(!newItem.trim()) return; setKit(p=>({...p,[sKey]:[...(p[sKey]||[]),newItem.trim()]})); setNewItem(''); };
  const removeItem = item => { setKit(p=>({...p,[sKey]:p[sKey].filter(i=>i!==item)})); setKitChecked(p=>{const n={...p};delete n[sKey+'_'+item];return n;}); };

  return (
    <div>
      <div style={{marginBottom:12}}>
        <div style={{fontSize:'.6rem',fontWeight:800,color:'var(--tx3)',letterSpacing:'.1em',textTransform:'uppercase'}}>School Ready</div>
        <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:'1.7rem',letterSpacing:'.04em',color:'var(--teal)',lineHeight:1.05}}>School</div>
      </div>
      <div style={{display:'flex',gap:4,marginBottom:10,overflowX:'auto',paddingBottom:2}}>
        {SUB.map(s=>(
          <button key={s.id} onClick={()=>{setSub(s.id);setNewItem('');}} style={{
            flexShrink:0,padding:'7px 8px',borderRadius:8,
            border:`1px solid ${sub===s.id?'var(--teal)':'var(--bdr2)'}`,
            background:sub===s.id?'rgba(77,187,184,.1)':'none',cursor:'pointer',
            fontFamily:'Nunito,sans-serif',fontWeight:800,fontSize:'.63rem',
            color:sub===s.id?'var(--teal)':'var(--tx3)',textAlign:'center',transition:'all .15s',minWidth:58}}>
            <div style={{fontSize:'1rem',marginBottom:2}}>{s.emoji}</div>
            {s.label}
          </button>
        ))}
      </div>
      <div style={{background:allDone?'rgba(122,182,72,.08)':'var(--card2)',border:`1px solid ${allDone?'rgba(122,182,72,.3)':'var(--bdr)'}`,borderRadius:9,padding:'9px 12px',marginBottom:9}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:'.95rem',letterSpacing:'.04em',color:allDone?'var(--green)':'var(--tx2)'}}>
            {allDone?'✅ All sorted':`${done} / ${items.length} checked`}
          </div>
          <div style={{fontSize:'.66rem',fontWeight:800,color:allDone?'var(--green)':'var(--tx3)'}}>{pct}%</div>
        </div>
        <div className="progbar" style={{marginTop:6}}>
          <div className="progfill" style={{width:`${pct}%`,background:allDone?'var(--green)':'var(--teal)'}}/>
        </div>
      </div>
      <div className="card">
        {items.map(item=>{
          const checked = !!kitChecked[sKey+'_'+item];
          return (
            <div key={item} className={`ci ${checked?'ck':''}`} onClick={()=>toggle(item)}>
              <div className={`cbox ${checked?'on':''}`}>{checked&&<Check size={11} color="#fff"/>}</div>
              <span className="clabel">{item}</span>
              <button className="del" onClick={e=>{e.stopPropagation();removeItem(item);}}><Trash2 size={12}/></button>
            </div>
          );
        })}
        <div style={{display:'flex',gap:5,marginTop:7}}>
          <input value={newItem} onChange={e=>setNewItem(e.target.value)} placeholder="Add item..."
            onKeyDown={e=>e.key==='Enter'&&addItem()} style={{flex:1}}/>
          <button className="btn btn-teal btn-sm" onClick={addItem}><Plus size={12}/></button>
        </div>
      </div>
      <div style={{textAlign:'center',padding:'7px 0',fontSize:'.65rem',color:'var(--tx3)',fontStyle:'italic'}}>
        Checklist resets each morning.
      </div>
    </div>
  );
}

// ── COACH VIEW ────────────────────────────────────────────────────────────────
function CoachView({ workoutLog, setWorkoutLog, coachNotes, setCoachNotes, fixtures, setFixtures }) {
  const [filter, setFilter] = useState('all');
  const [expanded, setExpanded] = useState(null);
  const [completing, setCompleting] = useState(null);
  const [sessionNotes, setSessionNotes] = useState('');
  const [showAddFix, setShowAddFix] = useState(false);
  const [newFix, setNewFix] = useState({date:'',sport:'Rugby',location:'',kit:'',arrival:'',notes:'',result:'',wentWell:'',practise:''});
  const [notePrompt, setNotePrompt] = useState(COACH_NOTE_PROMPTS[0]);
  const [noteText, setNoteText] = useState('');
  const [showNoteHistory, setShowNoteHistory] = useState(false);

  const FILTERS = [
    {id:'all',l:'All'},{id:'warmup',l:'Warm-up'},{id:'rugby',l:'Rugby'},
    {id:'cricket',l:'Cricket'},{id:'tennis',l:'Tennis'},{id:'hockey',l:'Hockey'},
    {id:'sc',l:'S & C'},{id:'cooldown',l:'Cool-down'},{id:'recovery',l:'Recovery'},
    {id:'fixtures',l:'Fixtures'},{id:'notes',l:'Notes'},
  ];

  const getSessions = () => {
    if (filter==='warmup')   return WARMUP_SESSIONS;
    if (filter==='cooldown') return COOLDOWN_SESSIONS;
    if (filter==='recovery') return COACH_SESSIONS.filter(s=>s.cat==='Recovery');
    if (filter==='sc')       return COACH_SESSIONS.filter(s=>s.cat==='S&C');
    if (['rugby','cricket','tennis','hockey'].includes(filter))
      return COACH_SESSIONS.filter(s=>s.cat===filter.charAt(0).toUpperCase()+filter.slice(1));
    return [...WARMUP_SESSIONS,...COACH_SESSIONS,...COOLDOWN_SESSIONS];
  };

  const todayDone = workoutLog.filter(w=>w.date===TODAY_DATE).map(w=>w.sessionId);
  const weekDone  = workoutLog.filter(w=>{const d=new Date(w.date),now=new Date(),ws=new Date(now);ws.setDate(now.getDate()-now.getDay()+1);ws.setHours(0,0,0,0);return d>=ws;}).length;

  const diffCol = d => d===0?'var(--teal)':d===1?'var(--green)':d===2?'var(--amber)':'#e55';
  const diffLbl = d => ['Easy','Easy','Medium','Hard'][d] || 'Easy';

  const logSession = s => {
    setWorkoutLog(p=>[...p,{id:uid(),date:TODAY_DATE,sessionId:s.id,workoutName:s.cat+': '+s.name,notes:sessionNotes}]);
    setCompleting(null);setSessionNotes('');setExpanded(null);
  };

  const saveNote = () => {
    if(!noteText.trim()) return;
    setCoachNotes(p=>[...p,{id:uid(),date:TODAY_DATE,prompt:notePrompt,text:noteText.trim()}]);
    setNoteText('');
  };

  const saveFix = () => {
    if(!newFix.date&&!newFix.sport) return;
    setFixtures(p=>[...p,{id:uid(),...newFix}]);
    setNewFix({date:'',sport:'Rugby',location:'',kit:'',arrival:'',notes:'',result:'',wentWell:'',practise:''});
    setShowAddFix(false);
  };

  if (filter==='fixtures') return (
    <div>
      <div style={{marginBottom:12}}>
        <div style={{fontSize:'.6rem',fontWeight:800,color:'var(--tx3)',letterSpacing:'.1em',textTransform:'uppercase'}}>Match Prep</div>
        <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:'1.7rem',letterSpacing:'.04em',color:'var(--teal)',lineHeight:1.05}}>Fixtures</div>
      </div>
      <div className="ptabs">
        {FILTERS.map(f=><button key={f.id} className={`ptab ${filter===f.id?'on':''}`} onClick={()=>{setFilter(f.id);setExpanded(null);}}>{f.l}</button>)}

      <button className="btn btn-teal btn-sm" style={{marginBottom:10}} onClick={()=>setShowAddFix(v=>!v)}>

      {showAddFix && (

          <div className="frow">
            <div className="fld"><label>Date</label><input type="date" value={newFix.date} onChange={e=>setNewFix(p=>({...p,date:e.target.value}))}/></div>
            <div className="fld"><label>Sport</label>
              <select value={newFix.sport} onChange={e=>setNewFix(p=>({...p,sport:e.target.value}))}>
                {['Rugby','Cricket','Tennis','Hockey','Athletics','Other'].map(s=><option key={s}>{s}</option>)}
              </select>
            </div>
          </div>
          <div className="frow">
            <div className="fld"><label>Location</label><input value={newFix.location} onChange={e=>setNewFix(p=>({...p,location:e.target.value}))} placeholder="School, away ground..."/></div>
            <div className="fld"><label>Arrival time</label><input value={newFix.arrival} onChange={e=>setNewFix(p=>({...p,arrival:e.target.value}))} placeholder="e.g. 1:30pm"/></div>
          </div>
          <div className="fld"><label>Kit needed</label><input value={newFix.kit} onChange={e=>setNewFix(p=>({...p,kit:e.target.value}))} placeholder="Rugby kit, gumshield..."/></div>
          <div className="fld"><label>Notes</label><textarea value={newFix.notes} onChange={e=>setNewFix(p=>({...p,notes:e.target.value}))} placeholder="Anything to know..."/></div>
          <div className="frow">
            <div className="fld"><label>Result / score</label><input value={newFix.result} onChange={e=>setNewFix(p=>({...p,result:e.target.value}))} placeholder="Won 24-10..."/></div>
            <div className="fld"><label>One thing to practise</label><input value={newFix.practise} onChange={e=>setNewFix(p=>({...p,practise:e.target.value}))} placeholder="Side step, catching..."/></div>
          </div>
          <div className="fld"><label>What went well</label><input value={newFix.wentWell} onChange={e=>setNewFix(p=>({...p,wentWell:e.target.value}))} placeholder="Passing, attitude..."/></div>
          <button className="btn btn-teal" style={{width:'100%',justifyContent:'center',marginTop:4}} onClick={saveFix}>Save fixture</button>
        </div>
      )}
      {fixtures.length===0 ? (
        <div className="empty"><div style={{fontSize:'2.5rem'}}>🏆</div><p>No fixtures added yet</p></div>
      ) : (
        [...fixtures].sort((a,b)=>a.date.localeCompare(b.date)).map(f=>(
          <div key={f.id} style={{background:'var(--card)',border:'1px solid var(--bdr)',borderRadius:10,padding:'12px 14px',marginBottom:7}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:4}}>
              <div>
                <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:'1rem',letterSpacing:'.04em',color:'var(--teal)'}}>{f.sport} — {f.date?new Date(f.date+'T12:00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}):''}</div>
                {f.location&&<div style={{fontSize:'.75rem',fontWeight:700,color:'var(--tx2)',marginTop:1}}>{f.location}{f.arrival?' · '+f.arrival:''}</div>}
              </div>
              <button className="del" onClick={()=>setFixtures(p=>p.filter(x=>x.id!==f.id))}><Trash2 size={12}/></button>
            </div>
            {f.kit&&<div style={{fontSize:'.72rem',color:'var(--tx3)',marginTop:3}}><strong style={{color:'var(--tx2)'}}>Kit:</strong> {f.kit}</div>}
            {f.notes&&<div style={{fontSize:'.72rem',color:'var(--tx3)',marginTop:2}}>{f.notes}</div>}
            {f.result&&<div style={{fontSize:'.72rem',color:'var(--green)',marginTop:3,fontWeight:800}}>Result: {f.result}</div>}
            {f.wentWell&&<div style={{fontSize:'.72rem',color:'var(--tx3)',marginTop:2}}><strong style={{color:'var(--tx2)'}}>Went well:</strong> {f.wentWell}</div>}
            {f.practise&&<div style={{fontSize:'.72rem',color:'var(--amber)',marginTop:2,fontWeight:700}}>Practise: {f.practise}</div>}
          </div>
        ))
      )}
    </div>
  );

  if (filter==='notes') return (
    <div>
      <div style={{marginBottom:12}}>
        <div style={{fontSize:'.6rem',fontWeight:800,color:'var(--tx3)',letterSpacing:'.1em',textTransform:'uppercase'}}>Private</div>
        <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:'1.7rem',letterSpacing:'.04em',color:'var(--teal)',lineHeight:1.05}}>Coach Notes</div>
      </div>
      <div className="ptabs">
        {FILTERS.map(f=><button key={f.id} className={`ptab ${filter===f.id?'on':''}`} onClick={()=>{setFilter(f.id);setExpanded(null);}}>{f.l}</button>)}
      </div>
      <div className="card" style={{marginBottom:10}}>
        <div className="fld">
          <label>Prompt</label>
          <select value={notePrompt} onChange={e=>setNotePrompt(e.target.value)}>
            {COACH_NOTE_PROMPTS.map(p=><option key={p}>{p}</option>)}
          </select>
        </div>
        <div className="fld">
          <textarea value={noteText} onChange={e=>setNoteText(e.target.value)} placeholder="Write your note here..."/>
        </div>
        <button className="btn btn-teal" style={{width:'100%',justifyContent:'center'}} onClick={saveNote}>Save note</button>
      </div>
      {coachNotes.filter(n=>n.date===TODAY_DATE).length>0 && (
        <div style={{marginBottom:10}}>
          <div className="sec">Today</div>
          {coachNotes.filter(n=>n.date===TODAY_DATE).map(n=>(
            <div key={n.id} style={{background:'var(--card2)',borderRadius:8,padding:'10px 13px',marginBottom:5,borderLeft:'3px solid var(--teal)',display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
              <div style={{flex:1}}>
                <div style={{fontSize:'.65rem',fontWeight:800,color:'var(--teal)',marginBottom:3}}>{n.prompt}</div>
                <div style={{fontSize:'.84rem',color:'var(--tx)',lineHeight:1.5}}>{n.text}</div>
              </div>
              <button className="del" onClick={()=>setCoachNotes(p=>p.filter(x=>x.id!==n.id))}><Trash2 size={12}/></button>
            </div>
          ))}
        </div>
      )}
      <button className="btn btn-ghost btn-sm" onClick={()=>setShowNoteHistory(v=>!v)}>
        {showNoteHistory?'Hide history':'Show history'} ({coachNotes.filter(n=>n.date!==TODAY_DATE).length})
      </button>
      {showNoteHistory && coachNotes.filter(n=>n.date!==TODAY_DATE).sort((a,b)=>b.date.localeCompare(a.date)).map(n=>(
        <div key={n.id} style={{background:'var(--card2)',borderRadius:8,padding:'10px 13px',marginBottom:5,borderLeft:'3px solid var(--bdr2)',opacity:.75,marginTop:5,display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
          <div style={{flex:1}}>
            <div style={{fontSize:'.62rem',fontWeight:800,color:'var(--tx3)',marginBottom:2}}>{fmtDate(n.date)} · {n.prompt}</div>
            <div style={{fontSize:'.82rem',color:'var(--tx2)'}}>{n.text}</div>
          </div>
          <button className="del" onClick={()=>setCoachNotes(p=>p.filter(x=>x.id!==n.id))}><Trash2 size={12}/></button>
        </div>
      ))}
      {coachNotes.length===0 && <div className="empty"><div style={{fontSize:'2.5rem'}}>📋</div><p>Write your first note</p></div>}

  const sessions = getSessions();

  return (

        <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:'1.7rem',letterSpacing:'.04em',color:'var(--teal)',lineHeight:1.05}}>Coach</div>
        <div style={{fontSize:'.67rem',color:'var(--tx3)',marginTop:2}}>{weekDone} sessions this week</div>
      </div>
      <div className="ptabs">
        {FILTERS.map(f=><button key={f.id} className={`ptab ${filter===f.id?'on':''}`} onClick={()=>{setFilter(f.id);setExpanded(null);}}>{f.l}</button>)}
      </div>

      {sessions.map(s=>{
        const isExp  = expanded===s.id;
        const isDone = todayDone.includes(s.id);
        const isCmp  = completing===s.id;
        return (
          <div key={s.id} style={{marginBottom:6,borderRadius:10,overflow:'hidden',
            border:`1px solid ${isDone?'rgba(122,182,72,.35)':'var(--bdr)'}`,

            <div style={{padding:'11px 13px',cursor:'pointer',userSelect:'none',display:'flex',justifyContent:'space-between',alignItems:'center'}}

                </div>
                <div style={{fontSize:'.64rem',fontWeight:700,color:'var(--tx3)'}}>
                  <span style={{color:diffCol(s.diff),background:diffCol(s.diff)+'22',padding:'1px 6px',borderRadius:10,marginRight:5}}>{s.cat}</span>

                  {s.diff>0&&<span style={{marginLeft:5,color:diffCol(s.diff)}}>{diffLbl(s.diff)}</span>}
                </div>
              </div>
              <div style={{color:'var(--teal)',fontSize:'.8rem',transition:'transform .2s',transform:isExp?'rotate(180deg)':'none',marginLeft:8,flexShrink:0}}>▼</div>
            </div>
            {isExp && (
              <div style={{padding:'0 13px 12px',borderTop:'1px solid var(--bdr)'}}>
                <div className="sec" style={{marginTop:9}}>What you need</div>
                <div style={{fontSize:'.8rem',color:'var(--tx2)',fontWeight:700,marginBottom:8}}>{s.needs}</div>
                <div className="sec">How to do it</div>
                {s.steps.map((step,i)=>(
                  <div key={i} style={{display:'flex',gap:8,padding:'5px 0',borderBottom:'1px solid var(--bdr)',alignItems:'flex-start'}}>
                    <div style={{width:'17px',height:'17px',borderRadius:'50%',background:'var(--teal)',color:'#001a1a',fontFamily:"'Bebas Neue',sans-serif",fontSize:'.68rem',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,marginTop:'1px'}}>{i+1}</div>
                    <div style={{fontSize:'.83rem',fontWeight:700,color:'var(--tx2)',flex:1}}>{step}</div>
                  </div>
                ))}
                {s.cool&&s.cool!=='This is the cool-down'&&(
                  <>
                    <div className="sec">Cool-down</div>
                    <div style={{fontSize:'.78rem',color:'var(--tx3)',fontWeight:700,fontStyle:'italic'}}>{s.cool}</div>
                  </>
                )}
                {s.safety&&(
                  <div style={{marginTop:8,padding:'6px 10px',background:'rgba(212,146,77,.08)',border:'1px solid rgba(212,146,77,.2)',borderRadius:7}}>
                    <div style={{fontSize:'.7rem',fontWeight:800,color:'var(--amber)'}}>⚠️ {s.safety}</div>
                  </div>
                )}
                {!isDone&&!isCmp&&<button className="btn btn-teal" style={{width:'100%',marginTop:10,justifyContent:'center'}} onClick={e=>{e.stopPropagation();setCompleting(s.id);}}>Done properly ✓</button>}
                {isCmp&&(
                  <div style={{marginTop:9,padding:'9px',background:'var(--card2)',borderRadius:8}}>
                    <label>Quick note (optional)</label>
                    <input value={sessionNotes} onChange={e=>setSessionNotes(e.target.value)} placeholder="How did it feel?" style={{marginBottom:7}}/>
                    <div style={{display:'flex',gap:5}}>
                      <button className="btn btn-teal btn-sm" style={{flex:1}} onClick={()=>logSession(s)}>Captain effort ✓</button>
                      <button className="btn btn-ghost btn-sm" onClick={()=>setCompleting(null)}>Cancel</button>
                    </div>
                  </div>
                )}
                {isDone&&<div style={{marginTop:9,textAlign:'center',fontSize:'.73rem',fontWeight:800,color:'var(--green)'}}>✅ Done today — strong work</div>}
              </div>
            )}
          </div>
        );
      })}
      {sessions.length===0&&<div className="empty"><div style={{fontSize:'2.5rem'}}>🏃</div><p>No sessions in this filter</p></div>}
      {workoutLog.length>0&&(
        <div style={{marginTop:16}}>
          <div className="sec">Recent sessions</div>
          {[...workoutLog].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5).map(w=>(
            <div key={w.id} style={{background:'var(--card2)',borderRadius:7,padding:'8px 12px',marginBottom:5,borderLeft:'3px solid var(--teal)',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
              <div>
                <div style={{fontWeight:800,fontSize:'.84rem'}}>{w.workoutName}</div>
                <div style={{fontSize:'.65rem',color:'var(--tx3)',marginTop:1}}>{fmtDate(w.date)}{w.notes?' · '+w.notes:''}</div>
              </div>
              <button className="del" onClick={()=>setWorkoutLog(p=>p.filter(x=>x.id!==w.id))}><Trash2 size={12}/></button>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

      {showRules&&(
        <div style={{background:'rgba(77,187,184,.06)',border:'1px solid rgba(77,187,184,.18)',borderRadius:9,padding:'12px 14px',marginBottom:10}}>
          <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:'.9rem',letterSpacing:'.08em',color:'var(--teal)',marginBottom:7}}>Creator Rules</div>
          {CREATOR_RULES.map((r,i)=>(
            <div key={i} style={{display:'flex',gap:7,marginBottom:4,alignItems:'flex-start'}}>
              <span style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:'.8rem',color:'var(--teal)',flexShrink:0,marginTop:1}}>{i+1}</span>
              <span style={{fontSize:'.8rem',color:'var(--tx2)',fontWeight:700}}>{r}</span>
            </div>
          ))}
        </div>
      )}

      {filtered.map(c=>{
        const isExp  = expanded===c.id;
        const isDone = todayDone.includes(c.id);
        const isCmp  = completing===c.id;
        return (
          <div key={c.id} style={{marginBottom:6,borderRadius:10,overflow:'hidden',
            border:`1px solid ${isDone?'rgba(122,182,72,.35)':'var(--bdr)'}`,
            background:isDone?'rgba(122,182,72,.04)':'var(--card)'}}>
            <div style={{padding:'11px 13px',cursor:'pointer',userSelect:'none',display:'flex',justifyContent:'space-between',alignItems:'center'}}
              onClick={()=>setExpanded(isExp?null:c.id)}>
              <div style={{flex:1,minWidth:0}}>
                <div style={{display:'flex',alignItems:'center',gap:7,marginBottom:2}}>
                  <span style={{fontSize:'1.1rem'}}>{c.emoji}</span>
                  <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:'.95rem',letterSpacing:'.04em',color:isDone?'var(--green)':'var(--tx)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{c.name}{isDone?' ✓':''}</div>
                </div>
                <div style={{fontSize:'.64rem',fontWeight:700,color:'var(--tx3)'}}>
                  <span style={{color:diffCol(c.diff),background:diffCol(c.diff)+'22',padding:'1px 6px',borderRadius:10,marginRight:5}}>{c.cat}</span>
                  {c.time}
                </div>
              </div>
              <div style={{color:'var(--teal)',fontSize:'.8rem',transition:'transform .2s',transform:isExp?'rotate(180deg)':'none',marginLeft:8,flexShrink:0}}>▼</div>
            </div>
            {isExp&&(
              <div style={{padding:'0 13px 12px',borderTop:'1px solid var(--bdr)'}}>
                <div className="sec" style={{marginTop:9}}>What you need</div>
                <div style={{fontSize:'.8rem',color:'var(--tx2)',fontWeight:700,marginBottom:8}}>{c.needs}</div>
                <div style={{fontSize:'.79rem',color:'var(--tx3)',marginBottom:8}}>{c.desc}</div>
                <div className="sec">How to do it</div>
                {c.steps.map((step,i)=>(
                  <div key={i} style={{display:'flex',gap:8,padding:'5px 0',borderBottom:'1px solid var(--bdr)',alignItems:'flex-start'}}>
                    <div style={{width:'17px',height:'17px',borderRadius:'50%',background:'var(--teal)',color:'#001a1a',fontFamily:"'Bebas Neue',sans-serif",fontSize:'.68rem',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,marginTop:'1px'}}>{i+1}</div>
                    <div style={{fontSize:'.82rem',fontWeight:700,color:'var(--tx2)',flex:1}}>{step}</div>
                  </div>
                ))}
                {c.safety&&(
                  <div style={{marginTop:8,padding:'6px 10px',background:'rgba(212,146,77,.08)',border:'1px solid rgba(212,146,77,.2)',borderRadius:7}}>
                    <div style={{fontSize:'.7rem',fontWeight:800,color:'var(--amber)'}}>⚠️ {c.safety}</div>
                  </div>
                )}
                {c.done&&<div style={{fontSize:'.7rem',fontWeight:800,color:'var(--teal)',marginTop:8,letterSpacing:'.04em'}}>Finish goal: {c.done}</div>}
                {!isDone&&!isCmp&&<button className="btn btn-teal" style={{width:'100%',marginTop:10,justifyContent:'center'}} onClick={e=>{e.stopPropagation();setCompleting(c.id);}}>Challenge done ✓</button>}
                {isCmp&&(
                  <div style={{marginTop:9,padding:'9px',background:'var(--card2)',borderRadius:8}}>
                    <label>Quick note (optional)</label>
                    <input value={logNotes} onChange={e=>setLogNotes(e.target.value)} placeholder="How did it go?" style={{marginBottom:7}}/>
                    <div style={{display:'flex',gap:5}}>
                      <button className="btn btn-teal btn-sm" style={{flex:1}} onClick={()=>logChallenge(c)}>Captain creativity ✓</button>
                      <button className="btn btn-ghost btn-sm" onClick={()=>setCompleting(null)}>Cancel</button>
                    </div>
                  </div>
                )}
                {isDone&&<div style={{marginTop:9,textAlign:'center',fontSize:'.73rem',fontWeight:800,color:'var(--green)'}}>✅ Done today — maker skills building</div>}
              </div>
            )}
          </div>
        );
      })}

      {creatorLog.length>0&&(
        <div style={{marginTop:16}}>
          <div className="sec">Recent challenges</div>
          {[...creatorLog].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5).map(c=>(
            <div key={c.id} style={{background:'var(--card2)',borderRadius:7,padding:'8px 12px',marginBottom:5,borderLeft:'3px solid var(--green)',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
              <div>
                <div style={{fontWeight:800,fontSize:'.84rem'}}>{c.challengeName}</div>
                <div style={{fontSize:'.65rem',color:'var(--tx3)',marginTop:1}}>{fmtDate(c.date)}{c.notes?' · '+c.notes:''}</div>
              </div>
              <button className="del" onClick={()=>setCreatorLog(p=>p.filter(x=>x.id!==c.id))}><Trash2 size={12}/></button>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ── CHORES VIEW ───────────────────────────────────────────────────────────────
function ChoresView({ isSchoolDay, choresChecked, setChoresChecked }) {
  const key = (section, item) => `${TODAY_DATE}_${section}_${item}`;
  const toggle = (section, item) => { const k=key(section,item); setChoresChecked(prev=>({...prev,[k]:!prev[k]})); };
  const checked = (section, item) => !!choresChecked[key(section,item)];
  const mainJobKey = `${TODAY_DATE}_mainJob_selected`;

  const sectionData = isSchoolDay
    ? [
        {id:'morning',label:'Morning — 5 mins',emoji:'☀️',items:CHORES_SCHOOL.morning},
        {id:'after',label:'After school',emoji:'🏠',items:CHORES_SCHOOL.afterSchool},
        {id:'evening',label:'Evening reset',emoji:'🌙',items:CHORES_SCHOOL.evening},
      ]
    : [
        {id:'morning',label:'Morning reset',emoji:'☀️',items:CHORES_NON_SCHOOL.morning},
        {id:'evening',label:'Evening reset',emoji:'🌙',items:CHORES_NON_SCHOOL.evening},
      ];

  const totalChores = sectionData.reduce((n,s)=>n+s.items.length,0)+(!isSchoolDay?1:0);
  const doneChores  = sectionData.reduce((n,s)=>n+s.items.filter(i=>checked(s.id,i)).length,0)+((!isSchoolDay&&choresChecked[mainJobKey])?1:0);
  const allDone = doneChores===totalChores && totalChores>0;

  return (
    <div>
      <div style={{marginBottom:12}}>
        <div style={{fontSize:'.6rem',fontWeight:800,color:'var(--tx3)',letterSpacing:'.1em',textTransform:'uppercase'}}>{isSchoolDay?'Quick reset':'Helping out'}</div>
        <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:'1.7rem',letterSpacing:'.04em',color:'var(--teal)',lineHeight:1.05}}>Chores</div>
        <div style={{fontSize:'.67rem',color:'var(--tx3)',marginTop:2}}>{isSchoolDay?'Calm start. Ready for tomorrow.':'One proper job. Help the family.'}</div>
      </div>

      <div style={{background:allDone?'rgba(122,182,72,.08)':'var(--card2)',border:`1px solid ${allDone?'rgba(122,182,72,.3)':'var(--bdr)'}`,borderRadius:9,padding:'9px 12px',marginBottom:10}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:'.95rem',letterSpacing:'.04em',color:allDone?'var(--green)':'var(--tx2)'}}>
            {allDone?'All done — captain effort 🏆':`${doneChores} of ${totalChores} done`}
          </div>
          <div style={{fontSize:'.66rem',fontWeight:800,color:allDone?'var(--green)':'var(--tx3)'}}>{totalChores>0?Math.round(doneChores/totalChores*100):100}%</div>
        </div>
        <div className="progfill" style={{height:4,background:allDone?'var(--green)':'var(--teal)',borderRadius:2,marginTop:6,transition:'width .4s ease',width:`${totalChores>0?Math.round(doneChores/totalChores*100):100}%`}}/>
      </div>

      {sectionData.map(s=>(
        <div key={s.id} style={{marginBottom:7}}>
          <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:'.86rem',letterSpacing:'.08em',color:'var(--tx3)',marginBottom:5,display:'flex',alignItems:'center',gap:5}}>
            {s.emoji} {s.label}
          </div>
          <div className="card" style={{padding:'8px 14px'}}>
            {s.items.map(item=>(
              <div key={item} className={`ci ${checked(s.id,item)?'ck':''}`} onClick={()=>toggle(s.id,item)}>
                <div className={`cbox ${checked(s.id,item)?'on':''}`}>{checked(s.id,item)&&<Check size={11} color="#fff"/>}</div>
                <span className="clabel">{item}</span>
              </div>
            ))}
          </div>
        </div>
      ))}

      {!isSchoolDay&&(
        <div style={{marginTop:4}}>
          <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:'.86rem',letterSpacing:'.08em',color:'var(--tx3)',marginBottom:5}}>💪 One proper helping job</div>
          <div className="card" style={{padding:'8px 14px'}}>
            <div className="fld" style={{marginBottom:6}}>
              <select value={choresChecked[`${TODAY_DATE}_job_pick`]||''} onChange={e=>setChoresChecked(prev=>({...prev,[`${TODAY_DATE}_job_pick`]:e.target.value}))}>
                <option value="">Choose a job...</option>
                {CHORES_NON_SCHOOL.mainJobs.map(j=><option key={j}>{j}</option>)}
              </select>
            </div>
            {choresChecked[`${TODAY_DATE}_job_pick`]&&(
              <div className={`ci ${choresChecked[mainJobKey]?'ck':''}`} onClick={()=>setChoresChecked(prev=>({...prev,[mainJobKey]:!prev[mainJobKey]}))}>
                <div className={`cbox ${choresChecked[mainJobKey]?'on':''}`}>{choresChecked[mainJobKey]&&<Check size={11} color="#fff"/>}</div>
                <span className="clabel">{choresChecked[`${TODAY_DATE}_job_pick`]}</span>
              </div>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

// ── PROGRESS VIEW ─────────────────────────────────────────────────────────────
function ProgressView({ workoutLog, creatorLog, choresChecked, kitChecked, wins, setWins }) {
  const [newWin, setNewWin] = useState('');
  const getWeekCount = arr => arr.filter(w=>{
    const d=new Date(w.date),now=new Date(),ws=new Date(now);
    ws.setDate(now.getDate()-now.getDay()+1);ws.setHours(0,0,0,0);return d>=ws;
  }).length;

  const weekCoach   = getWeekCount(workoutLog);
  const weekCreate  = getWeekCount(creatorLog);
  const totalCoach  = workoutLog.length;
  const totalCreate = creatorLog.length;
  const weekChores  = Object.keys(choresChecked||{}).filter(k=>k.startsWith(TODAY_DATE)&&choresChecked[k]).length;

  const levelBadge = n => n===0?null:n<3?{label:'Bronze',color:'#cd7f32'}:n<6?{label:'Silver',color:'#c0c0c0'}:n<10?{label:'Gold',color:'#d4924d'}:{label:'Captain',color:'var(--teal)'};
  const coachBadge = levelBadge(totalCoach);

  const addWin = () => { if(!newWin.trim()) return; setWins(p=>[...p,{id:uid(),date:TODAY_DATE,text:newWin.trim()}]); setNewWin(''); };

  return (
    <div>
      <div style={{marginBottom:12}}>
        <div style={{fontSize:'.6rem',fontWeight:800,color:'var(--tx3)',letterSpacing:'.1em',textTransform:'uppercase'}}>This week</div>
        <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:'1.7rem',letterSpacing:'.04em',color:'var(--teal)',lineHeight:1.05}}>Progress</div>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:6,marginBottom:10}}>
        {[
          {n:weekCoach,l:'Sessions',col:'var(--teal)'},
          {n:weekCreate,l:'Created',col:'var(--green)'},
          {n:weekChores,l:'Helped',col:'var(--amber)'},
        ].map(s=>(
          <div key={s.l} style={{background:'var(--card2)',borderRadius:8,padding:'10px',textAlign:'center',border:'1px solid var(--bdr)'}}>
            <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:'1.8rem',color:s.col,lineHeight:1}}>{s.n}</div>
            <div style={{fontSize:'.57rem',fontWeight:800,textTransform:'uppercase',letterSpacing:'.06em',color:'var(--tx3)',marginTop:2}}>{s.l}</div>
          </div>
        ))}
      </div>

      {coachBadge&&(
        <div style={{background:'rgba(77,187,184,.07)',border:'1px solid rgba(77,187,184,.2)',borderRadius:10,padding:'11px 14px',marginBottom:10,display:'flex',alignItems:'center',gap:12}}>
          <div style={{fontSize:'1.8rem'}}>{coachBadge.label==='Bronze'?'🥉':coachBadge.label==='Silver'?'🥈':coachBadge.label==='Gold'?'🥇':'⭐'}</div>
          <div>
            <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:'1.2rem',letterSpacing:'.06em',color:coachBadge.color}}>{coachBadge.label}</div>
            <div style={{fontSize:'.7rem',fontWeight:700,color:'var(--tx3)'}}>{totalCoach} training sessions — strong rhythm</div>
          </div>
        </div>
      )}

      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:6,marginBottom:10}}>
        {[
          {n:totalCoach,l:'Total sessions',col:'var(--teal)'},
          {n:totalCreate,l:'Create challenges',col:'var(--green)'},
        ].map(s=>(
          <div key={s.l} style={{background:'var(--card2)',borderRadius:8,padding:'10px 12px',border:'1px solid var(--bdr)'}}>
            <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:'1.8rem',color:s.col,lineHeight:1}}>{s.n}</div>
            <div style={{fontSize:'.6rem',fontWeight:800,color:'var(--tx3)',letterSpacing:'.06em',marginTop:3,textTransform:'uppercase'}}>{s.l}</div>
          </div>
        ))}
      </div>

      <div className="sec">Wins and good stuff</div>
      <div style={{display:'flex',gap:5,marginBottom:8}}>
        <input value={newWin} onChange={e=>setNewWin(e.target.value)} placeholder="Write a win..." onKeyDown={e=>e.key==='Enter'&&addWin()} style={{flex:1}}/>
        <button className="btn btn-teal btn-sm" onClick={addWin}><Plus size={12}/></button>
      </div>
      {wins.length===0
        ? <div className="empty"><p>Log your first win — anything counts</p></div>
        : [...wins].sort((a,b)=>b.date.localeCompare(a.date)).map(w=>(
            <div key={w.id} style={{background:'var(--card2)',borderRadius:7,padding:'8px 12px',marginBottom:5,borderLeft:'3px solid var(--teal)',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
              <div>
                <div style={{fontWeight:800,fontSize:'.84rem'}}>{w.text}</div>
                <div style={{fontSize:'.65rem',color:'var(--tx3)',marginTop:1}}>{fmtDate(w.date)}</div>
              </div>
              <button className="del" onClick={()=>setWins(p=>p.filter(x=>x.id!==w.id))}><Trash2 size={12}/></button>
            </div>
          ))
      }
    </div>
  );
}

// ── ALBERT HUB ────────────────────────────────────────────────────────────────
function AlbertHub() {
  const [tab, setTab] = useState('today');
  const [isSchoolDay, setIsSchoolDay] = useState(()=>{
    const saved=store.get('albert_schoolDay');
    return saved!==null?saved:![5,6].includes(new Date().getDay());
  });
  const [moods,       setMoods]       = useState([]);
  const [workoutLog,  setWorkoutLog]  = useState([]);
  const [creatorLog,  setCreatorLog]  = useState([]);
  const [wins,        setWins]        = useState([]);
  const [coachNotes,  setCoachNotes]  = useState([]);
  const [fixtures,    setFixtures]    = useState([]);
  const [choresChecked,setChoresChecked]=useState({});
  const [kit,         setKit]         = useState(null);
  const [kitChecked,  setKitChecked]  = useState({});
  const [loaded,      setLoaded]      = useState(false);

  useEffect(()=>{
    const el=document.createElement('style');
    el.textContent=CSS;
    document.head.appendChild(el);
    return ()=>document.head.removeChild(el);
  },[]);

  useEffect(()=>{
    setMoods(store.get('albert_moods')||[]);
    setWorkoutLog(store.get('albert_workouts')||[]);
    setCreatorLog(store.get('albert_creator')||[]);
    setWins(store.get('albert_wins')||[]);
    setCoachNotes(store.get('albert_coachNotes')||[]);
    setFixtures(store.get('albert_fixtures')||[]);
    setChoresChecked(store.get(`albert_chores_${TODAY_DATE}`)||{});
    setKit(store.get('albert_kit')||{...DEFAULT_KIT});
    setKitChecked(store.get(`albert_kitChecked_${TODAY_DATE}`)||{});
    setLoaded(true);
  },[]);

  useEffect(()=>{ if(!loaded) return;
    store.set('albert_moods',moods);
    store.set('albert_workouts',workoutLog);
    store.set('albert_creator',creatorLog);
    store.set('albert_wins',wins);
    store.set('albert_coachNotes',coachNotes);
    store.set('albert_fixtures',fixtures);
    store.set('albert_schoolDay',isSchoolDay);
  },[moods,workoutLog,creatorLog,wins,coachNotes,fixtures,isSchoolDay,loaded]);

  useEffect(()=>{ if(!loaded) return; store.set(`albert_chores_${TODAY_DATE}`,choresChecked); },[choresChecked,loaded]);
  useEffect(()=>{ if(!loaded) return; store.set(`albert_kitChecked_${TODAY_DATE}`,kitChecked); },[kitChecked,loaded]);
  useEffect(()=>{ if(!loaded||!kit) return; store.set('albert_kit',kit); },[kit,loaded]);

  if(!loaded||!kit) return (
    <div style={{height:'100vh',display:'flex',alignItems:'center',justifyContent:'center',color:'#506048',fontFamily:'sans-serif',fontSize:'14px'}}>Loading...</div>
  );

  const allKitItems = [
    ...(kit.schoolBag||[]).map(i=>({k:`schoolBag_${i}`})),
    ...(kit.uniform||[]).map(i=>({k:`uniform_${i}`})),
    ...(kit.peKit||[]).map(i=>({k:`peKit_${i}`})),
    ...(kit.rugbyKit||[]).map(i=>({k:`rugbyKit_${i}`})),
    ...(kit.cricketKit||[]).map(i=>({k:`cricketKit_${i}`})),
  ];
  const kitDone  = allKitItems.filter(i=>kitChecked[i.k]).length;
  const kitTotal = allKitItems.length;

  const TABS = [
    {id:'today',   label:'Today',   icon:'🏠'},
    {id:'school',  label:'School',  icon:'🏫'},
    {id:'coach',   label:'Coach',   icon:'🏃'},
    {id:'create',  label:'Create',  icon:'🎬'},
    {id:'chores',  label:'Chores',  icon:'🏡'},
    {id:'progress',label:'Progress',icon:'📈'},
  ];

  return (
    <div className="app">
      <div className="hdr">
        <div>
          <div className="logo">Chino<span> HQ</span></div>
          <div style={{fontSize:'.58rem',fontWeight:800,color:'var(--tx3)',letterSpacing:'.1em',marginTop:1}}>SPORTY · CREATIVE · CHINO</div>
        </div>
        <div className="hdr-r">
          <div className="hdr-day">{new Date().toLocaleDateString('en-GB',{weekday:'long'})}</div>
          <div className="hdr-date">{new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}</div>
          <div style={{marginTop:3,fontSize:'.58rem',fontWeight:800,color:isSchoolDay?'var(--teal)':'var(--amber)',letterSpacing:'.06em',textAlign:'right'}}>
            {isSchoolDay?'● SCHOOL':'● HOME'}
          </div>
        </div>
      </div>

      <nav>
        {TABS.map(t=>(
          <button key={t.id} className={`nb ${tab===t.id?'on':''}`} onClick={()=>setTab(t.id)}>
            <span style={{fontSize:'.85rem'}}>{t.icon}</span> {t.label}
          </button>
        ))}
      </nav>

      <div className="cnt">
        {tab==='today'    && <TodayView isSchoolDay={isSchoolDay} setIsSchoolDay={setIsSchoolDay} moods={moods} setMoods={setMoods} kitDone={kitDone} kitTotal={kitTotal} workoutLog={workoutLog} creatorLog={creatorLog} choresChecked={choresChecked} setTab={setTab}/>}
        {tab==='school'   && <SchoolView kit={kit} setKit={setKit} kitChecked={kitChecked} setKitChecked={setKitChecked}/>}
        {tab==='coach'    && <CoachView workoutLog={workoutLog} setWorkoutLog={setWorkoutLog} coachNotes={coachNotes} setCoachNotes={setCoachNotes} fixtures={fixtures} setFixtures={setFixtures}/>}
        {tab==='create'   && <CreateView creatorLog={creatorLog} setCreatorLog={setCreatorLog}/>}
        {tab==='chores'   && <ChoresView isSchoolDay={isSchoolDay} choresChecked={choresChecked} setChoresChecked={setChoresChecked}/>}
        {tab==='progress' && <ProgressView workoutLog={workoutLog} creatorLog={creatorLog} choresChecked={choresChecked} kitChecked={kitChecked} wins={wins} setWins={setWins}/>}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<AlbertHub/>);
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('data:application/javascript,' + encodeURIComponent(`
        const CACHE = 'chino-hq-v1';
        const ASSETS = [
          'https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js',
          'https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js',
          'https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.3/babel.min.js'
        ];
        self.addEventListener('install', e => e.waitUntil(caches.open(CACHE).then(c => c.addAll(ASSETS))));
        self.addEventListener('fetch', e => e.respondWith(caches.match(e.request).then(r => r || fetch(e.request))));
      `)).catch(()=>{});
    }
  </script>
</body>
